[training]
manifest = "outputs/training/data/manifest.json"
image_root = "Heridal.v2-yolo_non_412.coco/train"
output_dir = "outputs/training/local_pilot"
scope = "pilot"
device = "cpu"
image_size = 512
tile_size = 768
