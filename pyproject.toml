[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-object-detection"
version = "0.1.0"
description = "Offline aerial object detection experiments, COCO data utilities, and reproducible civilian demos."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "Pillow==11.0.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
training = [
    "pycocotools==2.0.11",
]
dev = [
    "pytest==8.3.4",
]
legacy-goturn = [
    "opencv-contrib-python-headless==4.12.0.88",
]
ros = []

[project.scripts]
aerial-detect = "falcon_vision_reconstructed.cli:main"
aerial-train = "falcon_vision_reconstructed.training:main"
falcon-train = "falcon_vision_reconstructed.training:main"
falcon = "falcon_vision_reconstructed.cli:main"
falcon-vision-demo = "falcon_vision_reconstructed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
